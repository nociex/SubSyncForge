# 输出配置
output:
  # 是否将节点去重
  deduplication: true
  
  # 是否过滤掉包含"剩余流量"、"重置时间"等无关信息的节点
  filterIrrelevant: true
  
  # 输出目录
  dir: "output"
  
  # 数据存储目录
  data_dir: "data"
  
  # GitHub 用户名 - 用于生成默认的 URL 前缀
  # 例如：your-username
  github_user: ""
  
  # GitHub 仓库名 - 用于生成默认的 URL 前缀
  # 例如：SubSyncForge
  repo_name: "SubSyncForge"
  
  # 生成的配置文件
  configs:
    # 所有节点列表 - 包含所有可用节点
    - name: "all_nodes"
      template: "templates/txt_list.txt"
      path: "all.txt"
      enabled: true
      options: {}  # 不设置任何过滤条件，包含所有节点
    
    # Mihomo (Clash Meta) 配置
    - name: "mihomo"
      template: "templates/mihomo.yaml"
      path: "mihomo.yaml"
      enabled: true
    
    # Surge 配置
    - name: "surge"
      template: "templates/surge.conf"
      path: "surge.conf"
      enabled: false
    
    # Sing-box 配置
    - name: "singbox"
      template: "templates/singbox.json"
      path: "singbox.json"
      enabled: true
    
    # V2Ray 配置 (选择第一个节点作为默认)
    - name: "v2ray"
      template: "templates/v2ray.json"
      path: "v2ray.json"
      enabled: false
      options:
        use_first_node: true
        
    # 香港节点列表
    - name: "hk_nodes"
      template: "templates/txt_list.txt"
      path: "hk.txt"
      enabled: true
      options:
        filter_by_region: ["香港", "HK", "Hong Kong"]
        
    # 美国节点列表
    - name: "us_nodes"
      template: "templates/txt_list.txt"
      path: "us.txt"
      enabled: true
      options:
        filter_by_region: ["美国", "US", "United States"]
        
    # 日本节点列表
    - name: "jp_nodes"
      template: "templates/txt_list.txt"
      path: "jp.txt"
      enabled: true
      options:
        filter_by_region: ["日本", "JP", "Japan"]
        
    # 新加坡节点列表
    - name: "sg_nodes"
      template: "templates/txt_list.txt"
      path: "sg.txt"
      enabled: true
      options:
        filter_by_region: ["新加坡", "SG", "Singapore"]
        
    # OpenAI 可用节点列表
    - name: "openai_nodes"
      template: "templates/txt_list.txt"
      path: "openai.txt"
      enabled: true
      options:
        filter_by_service: ["OpenAI"]
        
    # Disney+ 可用节点列表
    - name: "disney_nodes"
      template: "templates/txt_list.txt"
      path: "disney.txt"
      enabled: true
      options:
        filter_by_service: ["Disney", "Disney+"]
        
    # Netflix 可用节点列表
    - name: "netflix_nodes"
      template: "templates/txt_list.txt"
      path: "netflix.txt"
      enabled: true
      options:
        filter_by_service: ["Netflix"]

    # 台湾节点列表
    - name: "tw_nodes"
      template: "templates/txt_list.txt"
      path: "tw.txt"
      enabled: true
      options:
        filter_by_region: ["台湾", "TW", "Taiwan"]

    # 其他地区节点列表 (尝试使用 exclude_regions)
    - name: "other_nodes"
      template: "templates/txt_list.txt"
      path: "others.txt"
      enabled: true
      options:
        exclude_regions: ["香港", "HK", "Hong Kong", "美国", "US", "United States", "日本", "JP", "Japan", "新加坡", "SG", "Singapore", "台湾", "TW", "Taiwan"]

# 测试配置
testing:
  # 是否启用节点测试
  enabled: true
  
  # 测试并发数（同时测试多少个节点）
  concurrency: 50  
  
  # 测试超时时间（毫秒）
  timeout: 5000  
  
  # 测试URL
  test_url: "http://latency-test.skk.moe/endpoint"
  
  # 是否只保留测试成功的节点
  filter_invalid: true
  
  # 按延迟排序
  sort_by_latency: true
  
  # 保留延迟低于此值的节点（毫秒，0表示不限制）
  max_latency: 3000  
  
  # 保留最大节点数量（0表示不限制）
  max_nodes: 0
  
  # 每个类型的最大节点数量（0表示不限制）
  max_nodes_per_type: 0
  
  # 每个地区的最大节点数量（0表示不限制）
  max_nodes_per_region: 0
  
  # 是否验证并更正节点地区信息
  verify_location: true
  
  # 核心类型
  coreType: "mihomo"
  
  # 是否使用核心测试
  useCoreTest: true
  
  # 失败时是否回退到基本测试
  fallbackToBasic: false
  
  # 是否自动重命名
  autoRename: true
  
  # IP地址定位相关配置 (已移除，使用 AdvancedNodeTester 内置逻辑)

# 高级设置
advanced:
  # 缓存过期时间（秒）
  cache_ttl: 3600
  
  # 日志级别: debug, info, warn, error
  log_level: "info"  # 改为info级别，减少日志输出
  
  # 使用代理获取订阅内容
  proxy_for_subscription: false  # 暂时关闭代理，避免额外延迟
  
  # 节点排序
  sort_nodes: true
  
  # 定时同步设置（分钟）
  sync_interval: 360

# 计划任务
schedule:
  # 是否启用计划任务
  enabled: true
  
  # 同步订阅任务 - 每6小时执行一次
  sync_subscription:
    cron: "0 */12 * * *"  # 每12小时执行一次 (0分, 每12小时, 每天, 每月, 每周)
    enabled: true
    command: "npm run sync"
    
  # 清理缓存任务 - 每周执行一次
  clean_cache:
    cron: "0 0 * * 0"  # 每周日凌晨执行一次 (0分, 0时, 每天, 每月, 周日)
    enabled: true
    command: "node src/scripts/clean-cache.js"
