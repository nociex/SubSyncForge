<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubSyncForge Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-primary: #1a1b1e;
            --bg-secondary: #25262b;
            --bg-tertiary: #2c2e33;
            --text-primary: #c1c2c5;
            --text-secondary: #909296;
            --accent-blue: #228be6;
            --accent-blue-hover: #1c7ed6;
            --accent-green: #40c057;
            --accent-green-hover: #37b24d;
            --accent-red: #fa5252;
            --accent-red-hover: #f03e3e;
            --accent-yellow: #fab005;
            --accent-yellow-hover: #f59f00;
            --border-color: #373a40;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 500;
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
        }

        .status-badge.running {
            background-color: rgba(64, 192, 87, 0.2);
            color: var(--accent-green);
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            gap: 0.5rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .btn-primary {
            background-color: var(--accent-blue);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-blue-hover);
        }

        .btn-success {
            background-color: var(--accent-green);
        }

        .btn-success:hover:not(:disabled) {
            background-color: var(--accent-green-hover);
        }

        .btn-warning {
            background-color: var(--accent-yellow);
            color: #000;
        }

        .btn-warning:hover:not(:disabled) {
            background-color: var(--accent-yellow-hover);
        }

        .btn-danger {
            background-color: var(--accent-red);
        }

        .btn-danger:hover:not(:disabled) {
            background-color: var(--accent-red-hover);
        }

        .log-container {
            flex: 1;
            background-color: #0d1117;
            /* GitHub Dark terminal bg */
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 400px;
        }

        .log-header {
            padding: 0.75rem 1rem;
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
        }

        #logs {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: #e6edf3;
        }

        /* Basic ANSI colors simulation */
        .ansi-red {
            color: #ff7b72;
        }

        .ansi-green {
            color: #3fb950;
        }

        .ansi-yellow {
            color: #d29922;
        }

        .ansi-blue {
            color: #58a6ff;
        }

        .ansi-magenta {
            color: #bc8cff;
        }

        .ansi-cyan {
            color: #39c5cf;
        }

        .ansi-dim {
            opacity: 0.6;
        }

        .log-entry {
            margin-bottom: 2px;
        }

        .timestamp {
            color: var(--text-secondary);
            margin-right: 0.5rem;
            font-size: 0.8em;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <header>
        <h1>SubSyncForge Dashboard</h1>
        <div id="status" class="status-badge">Ready</div>
    </header>

    <div class="container">
        <div class="controls">
            <button id="startBtn" class="btn btn-primary">
                <span>🔄 Start Sync Task</span>
            </button>
            <button id="validateMihomoBtn" class="btn btn-success">
                <span>✅ Validate Mihomo</span>
            </button>
            <button id="validateSingboxBtn" class="btn btn-warning">
                <span>📦 Validate Singbox</span>
            </button>
            <button id="stopBtn" class="btn btn-danger" disabled>
                <span>⏹ Stop Tasks</span>
            </button>
        </div>

        <div class="log-container">
            <div class="log-header">
                <span>Live Logs</span>
                <span id="logCount">0 lines</span>
            </div>
            <div id="logs"></div>
        </div>
    </div>

    <script>
        const socket = io();
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const validateMihomoBtn = document.getElementById('validateMihomoBtn');
        const validateSingboxBtn = document.getElementById('validateSingboxBtn');
        const statusBadge = document.getElementById('status');
        const logsDiv = document.getElementById('logs');
        const logCountSpan = document.getElementById('logCount');

        let isRunning = false;
        let lineCount = 0;

        // --- UI Updates ---

        function updateState(running) {
            isRunning = running;
            startBtn.disabled = running;
            validateMihomoBtn.disabled = running;
            validateSingboxBtn.disabled = running;
            stopBtn.disabled = !running;

            if (running) {
                statusBadge.textContent = 'Running...';
                statusBadge.classList.add('running');
            } else {
                statusBadge.textContent = 'Idle';
                statusBadge.classList.remove('running');
            }
        }

        function appendLog(entry) {
            const div = document.createElement('div');
            div.className = 'log-entry';

            // Format timestamp
            const time = new Date(entry.timestamp).toLocaleTimeString();

            // Basic color processing
            let message = entry.message
                .replace(/\\x1B\\[31m/g, '<span class="ansi-red">')
                    .replace(/\\x1B\\[32m/g, '<span class="ansi-green">')
                        .replace(/\\x1B\\[33m/g, '<span class="ansi-yellow">')
                            .replace(/\\x1B\\[34m/g, '<span class="ansi-blue">')
                                .replace(/\\x1B\\[36m/g, '<span class="ansi-cyan">')
                                    .replace(/\\x1B\\[0m/g, '</span>')
                                        // Handle basic console.log styles if any or specific keywords
                                        .replace(/error/gi, '<span class="ansi-red">ERROR</span>')
                                        .replace(/warn/gi, '<span class="ansi-yellow">WARN</span>')
                                        .replace(/info/gi, '<span class="ansi-blue">INFO</span>')
                                        .replace(/success/gi, '<span class="ansi-green">SUCCESS</span>');

            div.innerHTML = `<span class="timestamp">[${time}]</span> ${message}`;
            logsDiv.appendChild(div);

            // Auto scroll
            logsDiv.scrollTop = logsDiv.scrollHeight;

            lineCount++;
            logCountSpan.textContent = `${lineCount} lines`;
        }

        // --- API Calls ---

        async function startTask() {
            try {
                const res = await fetch('/api/start', { method: 'POST' });
                const data = await res.json();
                if (!data.success) alert(data.error);
            } catch (e) {
                alert('Request failed');
            }
        }

        async function startValidation(core) {
            try {
                const res = await fetch(`/api/validate/${core}`, { method: 'POST' });
                const data = await res.json();
                if (!data.success) alert(data.error);
            } catch (e) {
                alert('Request failed');
            }
        }

        async function stopTask() {
            try {
                await fetch('/api/stop', { method: 'POST' });
            } catch (e) {
                alert('Request failed');
            }
        }

        // --- Event Listeners ---

        startBtn.onclick = startTask;
        validateMihomoBtn.onclick = () => startValidation('mihomo');
        validateSingboxBtn.onclick = () => startValidation('singbox');
        stopBtn.onclick = stopTask;

        // --- Socket Events ---

        socket.on('connect', () => {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    updateState(data.isRunning);
                    data.logs.forEach(appendLog);
                });
        });

        socket.on('status', (data) => {
            updateState(data.isRunning);
        });

        socket.on('log', (entry) => {
            appendLog(entry);
        });

        socket.on('clear_logs', () => {
            logsDiv.innerHTML = '';
            lineCount = 0;
            logCountSpan.textContent = '0 lines';
        });

    </script>
</body>

</html>
